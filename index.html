<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אקורדים">
<title>מחברת אקורדים</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d7a6e'/%3E%3Cg stroke='%23fff' stroke-width='3'%3E%3Cpath d='M18 14v36M27 14v36M37 14v36M46 14v36M14 16h36'/%3E%3C/g%3E%3Ccircle cx='27' cy='28' r='5' fill='%23fff'/%3E%3Ccircle cx='37' cy='38' r='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap">
<style>
/* Layout: white single-theme phone app. Library and editor scroll normally; the song screen is a
   fixed-height column: header, tabs, scrolling main area, and a docked YouTube player at the bottom. */
:root{
  --bg:#ffffff; --soft:#f3f5f7; --soft2:#e8ecef; --line:#e1e5e9;
  --ink:#14171c; --muted:#68707b; --faint:#b3b9c1;
  --accent:#0d7a6e; --accent-soft:#e2f2ef; --chord:#d9480f; --danger:#c92a2a;
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
bdi{direction:ltr;unicode-bidi:isolate}
#app{max-width:680px;margin-inline:auto;min-height:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app.full{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}

/* shared bits */
.hdr{display:flex;align-items:center;gap:10px;min-height:60px;flex:none}
.hdr h1{margin:0;font-size:1.45rem;font-weight:800;flex:1;min-width:0}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.ttl b{font-size:1.08rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink)}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:.88rem}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dng{color:var(--danger);border-color:#f0c4c4}
.btn[disabled]{opacity:.45;cursor:default}
.note{color:var(--muted);font-size:.85rem;margin:0}
.msg{color:var(--danger);font-weight:700;min-height:1.4em;margin:8px 0 0}
.msg.ok{color:var(--accent)}

/* library */
.list{display:flex;flex-direction:column;gap:10px;margin-block:8px 18px}
.song{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(20,23,28,.04)}
.song .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.song .nm b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .nm span{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;flex:none}
.tag{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.tag.sync{background:var(--accent-soft);color:var(--accent)}
.empty{margin-block:12px 18px;padding:22px;border-radius:20px;background:var(--soft)}
.empty h2{margin:0 0 6px;font-size:1.15rem}
.empty p{margin:0 0 16px;color:var(--muted)}
.row-acts{display:flex;flex-wrap:wrap;gap:8px}
.foot{border-top:1px solid var(--line);padding-top:14px;margin-top:8px;display:flex;flex-direction:column;gap:10px}

/* editor */
.fld{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.fld label,.fld .l{font-weight:700;font-size:.92rem}
.fld small{color:var(--muted);font-size:.82rem}
input[type=text],input[type=url],textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:16px}
textarea{min-height:240px;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:15px;line-height:1.4;white-space:pre;overflow:auto;resize:vertical}
.chk{display:flex;align-items:flex-start;gap:10px;margin-top:14px;font-size:.92rem}
.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:none}
.pv{padding:12px 14px;border:1px solid var(--line);border-radius:16px;--fs:18px}
.pv:empty::before{content:"התצוגה תופיע כאן כשתדביק שיר.";color:var(--faint);font-size:.9rem}

/* song screen */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--soft);flex:none}
.tabs button{min-height:38px;border:0;border-radius:11px;background:none;font-weight:700;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,23,28,.1)}
.opts{flex:none;margin-top:8px;padding:4px 14px;border:1px solid var(--line);border-radius:16px;background:#fff}
.orow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.lab{font-weight:700}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:1.25rem;font-weight:700;line-height:1}
.step output{min-width:56px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.sug p{margin:0;font-size:.9rem;min-width:0}
.sug .sh{color:var(--chord);font-weight:700;direction:ltr;unicode-bidi:isolate;display:inline-block}
.main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}

/* play view */
.play{display:flex;flex-direction:column;gap:16px;padding-block:14px 12px;min-height:100%}
.dpair{display:flex;align-items:flex-end;justify-content:center;gap:26px}
.dcard{display:flex;flex-direction:column;align-items:center;gap:2px;margin:0;transition:opacity .25s,transform .25s}
.dcard svg{display:block;height:auto}
.dcur svg{width:122px}
.dnext svg{width:84px}
.dnext{opacity:.32}
.dnext.soon{opacity:1;transform:scale(1.04)}
.dcur.wait{opacity:.4}
.dname{font-weight:800;font-size:1.7rem;line-height:1.1;direction:ltr}
.dnext .dname{font-size:1.15rem}
.dsub{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.prog{height:5px;border-radius:3px;background:var(--soft2);overflow:hidden;width:min(300px,80%);margin-inline:auto}
.prog i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:right center;transform:scaleX(0);border-radius:3px}
.tl{position:relative;height:62px;overflow:hidden;border-radius:16px;background:var(--soft);
  -webkit-mask-image:linear-gradient(to left,transparent 0,#000 6%,#000 88%,transparent 100%);mask-image:linear-gradient(to left,transparent 0,#000 6%,#000 88%,transparent 100%)}
.trk{position:absolute;top:0;bottom:0;right:28%;width:0;will-change:transform}
.blk{position:absolute;top:9px;bottom:9px;border-radius:11px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;padding-inline:10px;font-weight:800;font-size:1.05rem;direction:rtl;white-space:nowrap;overflow:hidden}
.blk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.blk.past{opacity:.4}
.phd{position:absolute;top:4px;bottom:4px;right:28%;width:3px;margin-right:-1px;border-radius:2px;background:var(--accent);z-index:2}
.lyrics{display:flex;flex-direction:column;gap:10px;text-align:center;flex:1;justify-content:flex-start}
.slab{font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.06em}
.lyr{font-size:22px;line-height:1.3}
.lyr.nx{font-size:18px;color:var(--faint)}
.lyr.nx .ch{color:var(--faint)}
.lyr .chrow{justify-content:center}
.synrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 12px;color:var(--muted);font-size:.85rem}
.synrow .step button{width:34px;height:34px;font-size:1.05rem}
.synrow .step output{min-width:64px;font-size:.88rem}
.warn{background:#fff4e6;color:#9a3d06;border-radius:12px;padding:10px 12px;font-size:.88rem;text-align:center}
.cta{margin-block:18px;padding:22px;border-radius:20px;background:var(--soft);display:flex;flex-direction:column;gap:12px}
.cta h2{margin:0;font-size:1.2rem}
.cta p{margin:0;color:var(--muted)}
.cta ol{margin:0;padding-inline-start:20px;color:var(--ink);display:flex;flex-direction:column;gap:4px}

/* sheet */
.sheet{font-size:var(--fs,20px);line-height:1.3;padding-block:6px 30px}
.gap{height:.7em}
.ln{margin-block:0 .3em}
.ln.pair{margin-block:.2em .55em;line-height:1.25}
.seg{display:inline-flex;flex-direction:column;vertical-align:bottom;max-width:100%}
.ch{font-weight:800;color:var(--chord);font-size:.82em;line-height:1.35;min-height:1.35em;white-space:pre;padding-inline-end:.5em;text-align:start}
.ch bdi{border-radius:6px;padding-inline:.15em;transition:background .15s,color .15s}
.ch.on bdi{background:var(--chord);color:#fff}
.tx{white-space:pre-wrap;min-height:1.25em}
.sec{font-weight:800;color:var(--muted);font-size:.62em;letter-spacing:.08em;margin-block:1.3em .4em;padding-block-end:.3em;border-bottom:1px solid var(--line)}
.chrow{direction:ltr;display:flex;flex-wrap:wrap;gap:.2em .8em;font-weight:800;color:var(--chord);margin-block:.25em .55em}
.chrow span{border-radius:6px;padding-inline:.15em}
.chrow span.on{background:var(--chord);color:#fff}
.dgs{display:flex;gap:12px;overflow-x:auto;padding-block:8px 6px;scrollbar-width:none}
.dgs::-webkit-scrollbar{display:none}
.dg{margin:0;flex:none;text-align:center}
.dg svg{display:block;width:62px;height:auto}
.dg figcaption{font-weight:800;font-size:.95rem;direction:ltr}
.sheetbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px}

/* diagram svg */
.gl{stroke:#c6ccd3;stroke-width:1}
.str{stroke:#9aa2ac;stroke-width:1}
.nut{stroke:var(--ink);stroke-width:3.2}
.dt,.bar{fill:var(--ink)}
.op{fill:none;stroke:var(--ink);stroke-width:1.3}
.mk{fill:var(--muted);font-size:9px;font-family:var(--font)}
.fn{fill:var(--muted);font-size:9px;font-weight:700;font-family:var(--font)}

/* record view */
.rec{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.rec h2{margin:0;font-size:1.15rem}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cnt{font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.rbar{height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.tap{width:100%;min-height:150px;border-radius:26px;border:0;background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .08s,background .12s;box-shadow:0 6px 18px rgba(13,122,110,.25)}
.tap b{font-size:3rem;font-weight:800;line-height:1.05;direction:ltr}
.tap small{font-size:.95rem;opacity:.9}
.tap.flash{background:var(--ink);transform:scale(.98)}
.tap[disabled]{background:var(--faint);box-shadow:none}
.racts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.racts .btn{padding:0 8px;font-size:.9rem}
.rctx{text-align:center;padding:12px;border-radius:16px;background:var(--soft)}

/* dock */
.dock{flex:none;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:center;padding-block:10px 8px;border-top:1px solid var(--line);background:#fff}
.vid{position:relative;aspect-ratio:16/9;width:100%;background:#0b0d10;border-radius:14px;overflow:hidden}
.vid iframe,.vid #yt{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;color:#cfd5db;font-size:.8rem}
.ctr{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.r1{display:flex;align-items:center;gap:10px}
.pp{width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.pp svg{width:24px;height:24px;fill:currentColor}
.cb{width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;color:var(--ink);flex:none;position:relative}
.cb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cb em{position:absolute;font-style:normal;font-size:.62rem;font-weight:800;bottom:6px}
.r2{display:flex;gap:6px}
.pill{min-height:32px;padding:0 12px;border-radius:99px;border:0;background:var(--soft);font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums}
.nodock{flex:none;border-top:1px solid var(--line);padding-block:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
@media (min-width:560px){.dock{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* audio dock */
.adock{display:flex;flex-direction:column;gap:6px;grid-template-columns:none}
.aprog{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.aprog input{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.actr{display:flex;align-items:center;justify-content:center;gap:10px}
.dmsg{font-size:.85rem;color:var(--muted);text-align:center;padding:6px}
/* source switch + file pick */
.src{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--soft)}
.src button{min-height:40px;border:0;border-radius:11px;background:none;font-weight:700;color:var(--muted)}
.src button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,23,28,.1)}
.pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fname{font-size:.9rem;color:var(--ink);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
/* analysis */
.anl{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 8px;text-align:center}
.anl h2{margin:0;font-size:1.2rem}
.anl .rbar{width:min(320px,90%)}
.anl .rbar i{transition:width .2s}
.wave{display:flex;gap:5px;align-items:flex-end;height:38px}
.wave span{width:6px;border-radius:3px;background:var(--accent);animation:wv 1s ease-in-out infinite}
.wave span:nth-child(2){animation-delay:.15s}.wave span:nth-child(3){animation-delay:.3s}.wave span:nth-child(4){animation-delay:.45s}.wave span:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:8px}50%{height:36px}}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:#0a5249;border-radius:12px;padding:10px 12px;font-size:.88rem}
.notice p{margin:0;flex:1}
.notice button{border:0;background:none;color:inherit;font-weight:800;min-height:28px}
/* strumming */
.strum{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sth{display:flex;align-items:center;gap:8px}
.sth div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.sth b{font-size:.95rem}
.sth span{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;border-radius:10px;background:var(--soft);color:var(--ink);transition:background .06s,color .06s}
.cell svg{width:20px;height:26px;display:block}
.cell .fg{height:26px;display:grid;place-items:center;font-weight:800;font-size:1.05rem}
.cell .ct{font-size:.7rem;color:var(--muted);font-weight:700}
.cell.bt .ct{color:var(--ink)}
.cell.rest{color:var(--faint)}
.cell.on{background:var(--accent);color:#fff}
.cell.on .ct{color:#fff}
.legend{font-size:.78rem;color:var(--muted);margin:0}
.rhp{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:12px}
.rhp h3{margin:0;font-size:.85rem;color:var(--muted);font-weight:800}
.pats{display:flex;flex-direction:column;gap:6px}
.pat{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff}
.pat.on{border-color:var(--accent);background:var(--accent-soft)}
.pat b{font-size:.92rem}
.pat .pv2{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;color:var(--muted);direction:ltr;margin-inline-start:auto;white-space:nowrap}
.pat .lv{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pat .rec{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tapbig{min-height:64px;border-radius:16px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:1.05rem;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tapbig.flash{background:var(--accent)}
/* fix panel */
.blk{cursor:pointer}
.blk.sel{outline:3px solid var(--chord);outline-offset:-3px}
.fix{border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.fixh{display:flex;align-items:center;gap:10px}
.fixh b{font-size:1.3rem;font-weight:800}
.fixh span{color:var(--muted);font-variant-numeric:tabular-nums;flex:1}
.fixr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fixr .btn{min-height:42px;padding:0 8px;font-size:.9rem}
.fixr select{grid-column:1/-1;min-height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 10px;font:inherit;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<input type="file" id="f-file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac" hidden>
<script>
/* ChordEngine: chord recognition and chord-sheet alignment from audio, no dependencies. */
(function(root){
'use strict';
var SR=11025, WIN=4096, HOP=1024;

/* ---------- FFT (radix-2, in place) ---------- */
function makeFFT(n){
  var lev=Math.log2(n)|0, rev=new Uint32Array(n), cos=new Float64Array(n/2), sin=new Float64Array(n/2), i;
  for(i=0;i<n;i++){ var r=0,x=i; for(var b=0;b<lev;b++){ r=(r<<1)|(x&1); x>>=1; } rev[i]=r; }

function synced(s){return !!(s.sync&&s.sync.times&&s.sync.times.some(function(x){return x!=null;})&&s.sync.vid===mediaKey(s));}
/* ---- audio files in IndexedDB ---- */
var IDBP=null;
function idb(){
  if(!IDBP) IDBP=new Promise(function(res,rej){
    try{ var r=indexedDB.open('chords-audio',1);
      r.onupgradeneeded=function(){ r.result.createObjectStore('files'); };
      r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
  return IDBP;
}
function idbDo(mode,fn){ return idb().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('files',mode), st=tx.objectStore('files'), rq=fn(st); tx.oncomplete=function(){ res(rq&&rq.result); }; tx.onerror=function(){ rej(tx.error); }; tx.onabort=function(){ rej(tx.error); }; }); }); }
function idbPut(id,blob){ return idbDo('readwrite',function(st){ return st.put(blob,id); }); }
function idbGet(id){ return idbDo('readonly',function(st){ return st.get(id); }); }
function idbDel(id){ return idbDo('readwrite',function(st){ return st.delete(id); }).catch(function(){}); }
function chordName(pc,minor,kind){ return minor?NAMES_MIN[pc]+'m':NAMES_MAJ[pc]+(kind==='7'?'7':''); }
function autoRaw(names){ var out=[]; for(var i=0;i<names.length;i+=4) out.push(names.slice(i,i+4).join('   ')); return out.join('\n'); }
function later(ms){ return new Promise(function(r){ setTimeout(r,ms||0); }); }

var PPS=58; // timeline pixels per second
var PL={ev:[],k:-2,lineShown:-1};
function sheetStruct(p){
  var sec=0, lineSec=[], F=p.F, st=[], i;
  p.lines.forEach(function(l,li){ if(l.t==='sec'||l.t==='blank') sec++; lineSec[li]=sec; });
  for(i=0;i<F.length;i++){
    var ls=i; while(ls>0&&F[ls-1].li===F[i].li) ls--;
    var ss=i; while(ss>0&&lineSec[F[ss-1].li]===lineSec[F[i].li]) ss--;
    st.push({line:ls,lineEnd:i+1===F.length||F[i+1].li!==F[i].li,sec:ss,secEnd:i+1===F.length||lineSec[F[i+1].li]!==lineSec[F[i].li]});
  }
  return st;
}
function events(s){
  var F=P(s).F, times=(s.sync&&s.sync.times)||[], ev=[];
  if(s.sync&&s.sync.ev){
    s.sync.ev.forEach(function(o,k){ var f=F[o.g]; if(f&&o.t!=null&&isFinite(o.t)) ev.push({c:f.c,li:f.li,g:f.g,t:o.t,o:k}); });
    ev.sort(function(a,b){return a.t-b.t;});
    return ev;
  }
  F.forEach(function(f,i){ var t=times[i]; if(t!=null&&isFinite(t)) ev.push({c:f.c,li:f.li,g:f.g,t:t}); });
  ev.sort(function(a,b){return a.t-b.t;});
  return ev;
}

  {id:'ar44',m:'4/4',name:'פריטת אצבעות',lv:'מתקדם',p:'B3231323'},
  {id:'q34',m:'3/4',name:'רבעים',lv:'קל',p:'D-D-D-'},

function meterKey(r){ return r.sub===3?'6/8':(r.meter===3?'3/4':'4/4'); }
function recPat(r){
  var k=meterKey(r), b=r.bpm;

  if(k==='3/4') return b<75?'ar34':'w34';
  return b<55?'ar68':'s68';
}
function patOf(r){
  var k=meterKey(r), id=r.pat;
  var p=PATS.filter(function(x){return x.id===id&&x.m===k;})[0];
  return p||PATS.filter(function(x){return x.id===recPat(r);})[0];
}

function strumTick(t){
  var s=cur(); if(!s||!s.rhythm||!s.rhythm.beats) return;
  var r=s.rhythm, B=r.beats, n=r.meter*r.sub, sl=-1;
  if(t>=B[0]&&t<B[B.length-1]+(B[B.length-1]-B[B.length-2])){
    var lo=0, hi=B.length-1;
    while(hi-lo>1){ var m=(lo+hi)>>1; if(B[m]<=t) lo=m; else hi=m; }
    if(t>=B[hi]) lo=hi;
    var nx=lo+1<B.length?B[lo+1]:B[lo]+(B[lo]-B[lo-1]);
    var frac=(t-B[lo])/(nx-B[lo]);
    var beatInBar=((lo-r.down)%r.meter+r.meter)%r.meter;
    sl=beatInBar*r.sub+Math.min(r.sub-1,Math.floor(frac*r.sub));
  }
  if(sl===RH.slot) return;
  var a=document.getElementById('sc'+RH.slot); if(a) a.classList.remove('on');
  var b=document.getElementById('sc'+sl); if(b&&sl<n) b.classList.add('on');
  RH.slot=sl;
}
function downFor(beats,m,changes,fallback){
  var cnt=[], j, i, any=false;
  for(i=0;i<m;i++) cnt.push(0);
  (changes||[]).forEach(function(t){
    var lo=0, hi=beats.length-1;
    while(hi-lo>1){ var md=(lo+hi)>>1; if(beats[md]<t) lo=md; else hi=md; }
    j=Math.abs(beats[lo]-t)<=Math.abs(beats[hi]-t)?lo:hi;
    if(Math.abs(beats[j]-t)<0.25){ cnt[j%m]++; any=true; }
  });
  if(!any) return fallback%m;
  var d=0; for(i=1;i<m;i++) if(cnt[i]>cnt[d]) d=i;
  return d;
}
function chordTimes(s){ return events(s).map(function(e){return e.t;}); }
function rhSet(fn){

// regroup the beat grid into a new meter, keeping the bar starts
function regrid(r,key){
  var slots=[], B=r.beats, i, k;
  for(i=0;i<B.length-1;i++) for(k=0;k<r.sub;k++) slots.push({t:B[i]+(B[i+1]-B[i])*k/r.sub,bar:k===0&&((i-r.down)%r.meter+r.meter)%r.meter===0});
  var nsub=key==='6/8'?3:2, nm=key==='6/8'?2:(key==='3/4'?3:4);
  var first=0; for(i=0;i<slots.length;i++) if(slots[i].bar){first=i;break;}
  var start=first%nsub, nb=[];
  for(i=start;i<slots.length;i+=nsub) nb.push(Math.round(slots[i].t*1000)/1000);
  r.beats=nb; r.sub=nsub; r.meter=nm;
  r.down=((Math.round((first-start)/nsub))%nm+nm)%nm;
  var iv=(nb[nb.length-1]-nb[0])/Math.max(1,nb.length-1); r.bpm=Math.round(600/iv)/10;
}
function runRhythm(){
  var s=cur(); if(!s||s.src!=='file'||!s.file||RH.busy) return;
  RH.busy=true; RH.panel=false; paintStrum();
  var id=s.id;
  idbGet(s.file.id).then(function(blob){
    if(!blob) throw 0;
    return blob.arrayBuffer?blob.arrayBuffer():new Response(blob).arrayBuffer();
  }).then(function(buf){ return ChordEngine.decode(buf); })
  .then(function(x){ return ChordEngine.rhythm(x,null,chordTimes(s)); })
  .then(function(r){
    RH.busy=false;
    if(r){ r.src='auto'; s.rhythm=r; touch(s); }
    if(S.id===id) paintStrum();
  }).catch(function(){ RH.busy=false; if(S.id===id) paintStrum(); });
}
function tapBeat(){
  if(!ytReady) return;

  RH.tap.push(nowT()-((cur()&&cur().offset)||0));
  var b=document.getElementById('tapbeat');
  if(b){ b.textContent='הקשות: '+RH.tap.length+' (המשך עד הסוף של כמה תיבות)'; b.classList.add('flash'); setTimeout(function(){b.classList.remove('flash');},90); }
  if(RH.tap.length===4) paintStrum();
}
function tapDone(){
  var s=cur(), T=RH.tap; if(!s||!T||T.length<4) return;
  var iv=[]; for(var i=1;i<T.length;i++){ var d=T[i]-T[i-1]; if(d>0.2&&d<2) iv.push(d); }
  if(iv.length<3){ RH.tap=null; paintStrum(); return; }
  iv.sort(function(a,b){return a-b;});
  var p=iv[iv.length>>1];
  // least-squares phase anchored on the taps
  var ph=0; T.forEach(function(t,i){ ph+=t-i*p; }); ph/=T.length;
  var old=s.rhythm, key=old?meterKey(old):'4/4', nm=key==='6/8'?2:(key==='3/4'?3:4), sub=key==='6/8'?3:2;
  var end=Math.max((AUD&&AUD.duration)||0,(T[T.length-1]+60),(PL.ev.length?PL.ev[PL.ev.length-1].t+20:0));
  var k0=Math.ceil(-ph/p), beats=[];
  for(var k=k0;ph+k*p<=end;k++) beats.push(Math.round((ph+k*p)*1000)/1000);
  s.rhythm={bpm:Math.round(600/p)/10,beats:beats,sub:sub,meter:nm,down:((-k0)%nm+nm)%nm,src:'tap',pat:old?old.pat:null};
  RH.tap=null; RH.panel=false; touch(s); paintStrum();
}

function updatePlay(now){
  var ev=PL.ev; if(!ev.length) return;

  while(k+1<ev.length&&ev[k+1].t<=t) k++;

/* =============== YouTube player + clock =============== */
var ytp=null, ytReady=false, ytWait=null, RATE=1;
var CLK={raw:-1,base:0,wall:0,playing:false,rate:1};
function loadYT(cb){
  if(window.YT&&window.YT.Player){cb();return;}
  ytWait=cb;
  var prev=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=function(){ if(prev) try{prev();}catch(e){} if(ytWait){var f=ytWait;ytWait=null;f();} };
  if(!document.getElementById('yt-api')){var t=document.createElement('script');t.id='yt-api';t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t);}
}
function mountPlayer(vid){
  ytReady=false;
  var vm=setTimeout(function(){ var m=document.getElementById('vmsg'); if(m&&!ytReady) m.textContent='הנגן לא נטען. בדוק את החיבור לאינטרנט.'; },9000);
  loadYT(function(){
    if(!document.getElementById('yt')) return;
    ytp=new window.YT.Player('yt',{videoId:vid,width:'100%',height:'100%',
      playerVars:{playsinline:1,rel:0,modestbranding:1,fs:1},
      events:{
        onReady:function(){ ytReady=true; clearTimeout(vm); var m=document.getElementById('vmsg'); if(m) m.remove(); try{ytp.setPlaybackRate(RATE);}catch(e){} },
        onStateChange:function(e){ CLK.playing=e.data===1; CLK.raw=-1; paintPP(); if(CLK.playing) wake(); else unwake(); },
        onPlaybackRateChange:function(e){ CLK.rate=e.data||1; CLK.raw=-1; },
        onError:function(){ var v=document.querySelector('.vid'); if(v&&!document.getElementById('vmsg')){var d=document.createElement('div');d.className='vmsg';d.id='vmsg';d.textContent='הסרטון לא זמין להטמעה. נסה קישור לגרסה אחרת של השיר.';v.appendChild(d);} }
      }});
  });
}
var AUD=null;
function mountAudio(s){
  ytReady=false;
  var dm=document.getElementById('dmsg');
  idbGet(s.file.id).then(function(blob){
    if(!blob){ if(dm){dm.hidden=false;dm.innerHTML='הקובץ של השיר לא נמצא בטלפון הזה. <button class="pill" data-act="edit">בחר אותו שוב</button>';} return; }
    if(S.view!=='song'||S.id!==s.id) return;
    var url=URL.createObjectURL(blob), a=new Audio();
    a.preload='auto'; a.src=url; AUD=a;
    try{ a.preservesPitch=true; a.mozPreservesPitch=true; a.webkitPreservesPitch=true; }catch(e){}
    function st(p){ CLK.playing=p; CLK.raw=-1; paintPP(); if(p) wake(); else unwake(); }
    a.addEventListener('play',function(){st(true);});
    a.addEventListener('pause',function(){st(false);});
    a.addEventListener('ended',function(){st(false);});
    a.addEventListener('seeked',function(){CLK.raw=-1;});
    a.addEventListener('loadedmetadata',function(){ var d=document.getElementById('adur'); if(d) d.textContent=fmt(a.duration); });
    a.addEventListener('error',function(){ if(dm){dm.hidden=false;dm.textContent='הדפדפן לא מצליח לנגן את הקובץ הזה.';} });
    ytp={
      getCurrentTime:function(){return a.currentTime;},
      playVideo:function(){ var p=a.play(); if(p&&p.catch) p.catch(function(){}); },
      pauseVideo:function(){a.pause();},
      seekTo:function(t){ try{a.currentTime=Math.max(0,Math.min(t,(a.duration||t+1)-0.05));}catch(e){} },
      setPlaybackRate:function(r){a.playbackRate=r;},
      destroy:function(){ a.pause(); a.removeAttribute('src'); try{a.load();}catch(e){} URL.revokeObjectURL(url); AUD=null; }
    };
    a.playbackRate=RATE; CLK.rate=RATE;
    ytReady=true;
  }).catch(function(){ if(dm){dm.hidden=false;dm.textContent='לא הצלחתי לטעון את הקובץ מהטלפון.';} });
}
function mountMedia(s){
  if(s.src==='file'){ if(s.file) mountAudio(s); }
  else { var vid=ytId(s.link); if(vid) mountPlayer(vid); }
}
function killPlayer(){ try{ if(ytp&&ytp.destroy) ytp.destroy(); }catch(e){} ytp=null; ytReady=false; CLK.playing=false; unwake(); }
function nowT(){
  if(!ytp||!ytReady||!ytp.getCurrentTime) return 0;
  var r=0; try{r=ytp.getCurrentTime()||0;}catch(e){}
  var w=performance.now();
  if(r!==CLK.raw){CLK.raw=r;CLK.base=r;CLK.wall=w;}
  if(CLK.playing) return CLK.base+Math.min(1.5,(w-CLK.wall)/1000)*CLK.rate;
  return r;
}
function paintPP(){
  var b=document.getElementById('pp'); if(!b) return;
  b.innerHTML=CLK.playing?IC.pause:IC.play; b.setAttribute('aria-label',CLK.playing?'השהה':'נגן');
}
var wl=null;
function wake(){try{if(navigator.wakeLock&&!wl) navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null;});}).catch(function(){});}catch(e){}}
function unwake(){try{if(wl) wl.release();}catch(e){} wl=null;}

var raf=0;
function loop(){
  raf=requestAnimationFrame(loop);
  if(S.view!=='song') return;
  var now=nowT();
  if(AUD){ var sr=document.getElementById('seekr'), at=document.getElementById('atime'); if(sr&&!sr._drag&&AUD.duration) sr.value=Math.round(1000*now/AUD.duration); if(at) at.textContent=fmt(now); }
  if(S.tab==='play') updatePlay(now);
  else if(S.tab==='sheet') updateSheet(now);
  else if(S.tab==='rec'){ var rt=document.getElementById('rtime'); if(rt) rt.textContent=fmt(now); }
}

/* =============== navigation =============== */
function render(){
  if(S.view==='song'){
    $app.className='full'; $app.innerHTML=viewSongShell(); paintOpts(); paintMain();
    mountMedia(cur());
  } else {
    $app.className=''; $app.innerHTML=S.view==='lib'?viewLib():viewEdit();
    if(S.view==='edit') paintPreview();
  }
}
function go(v){
  if(S.view==='song'&&v!=='song') killPlayer();
  R=null; S.view=v; S.confirmDel=false; S.opts=false; S.libMsg=''; S.notice=''; S.sel=-1; anlRun++; ANL=null;
  if(v==='song'){ S.tab='play'; SH.g=-1; SH.li=-1; PL.evFor=null; RH.panel=false; RH.tap=null; RH.busy=false; }
  render(); window.scrollTo(0,0);
}
function refreshSongView(){ paintOpts(); paintMain(); }

/* =============== backup =============== */
function exportBackup(){
  try{
    var blob=new Blob([JSON.stringify({app:'chords',v:2,songs:S.songs})],{type:'application/json'});
    var a=document.createElement('a'), d=new Date();
    a.href=URL.createObjectURL(blob);
    a.download='chords-backup-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
    S.libMsg={ok:true,text:'הגיבוי נשמר בתיקיית ההורדות.'};
  }catch(e){ S.libMsg={ok:false,text:'לא הצלחתי לשמור את הגיבוי.'}; }
  render();
}
document.getElementById('imp').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result), arr=Array.isArray(d)?d:d.songs, n=0;
      if(!Array.isArray(arr)) throw 0;
      arr.forEach(function(x){
        if(!x||!x.id||typeof x.raw!=='string') return;
        var ex=S.songs.filter(function(s){return s.id===x.id;})[0];
        if(!ex){S.songs.push(norm(x));n++;}
        else if((x.updatedAt||0)>(ex.updatedAt||0)){Object.keys(x).forEach(function(k){ex[k]=x[k];});n++;}
      });
      persist(); S.libMsg={ok:true,text:n?'נטענו '+n+' שירים מהגיבוי.':'כל השירים מהגיבוי כבר נמצאים כאן.'};
    }catch(err){ S.libMsg={ok:false,text:'הקובץ הזה לא נראה כמו גיבוי של האפליקציה.'}; }
    e.target.value=''; render();
  };
  rd.readAsText(f);
});

document.getElementById('f-file').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; if(!f||!S.draft) return;
  S.draft.fileObj=f;
  if(!S.draft.title.trim()){ S.draft.title=f.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim(); var ti=document.getElementById('f-title'); if(ti) ti.value=S.draft.title; }
  var fn=document.getElementById('fname'); if(fn) fn.textContent=f.name;
  var pb=document.querySelector('[data-act=pick]'); if(pb){ pb.textContent='החלף קובץ'; pb.className='btn'; }
  e.target.value='';
});

/* =============== actions =============== */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function newDraft(){return {id:null,title:'',artist:'',link:'',raw:'',mirror:false,src:'file',fileObj:null,fileName:''};}
function seekBy(d){ try{ if(ytp&&ytReady){ ytp.seekTo(Math.max(0,nowT()+d),true); CLK.raw=-1; } }catch(e){} }
function act(a,el){
  var s=cur();
  switch(a){
    case 'new': S.draft=newDraft(); go('edit'); break;
    case 'sample': S.draft=newDraft(); S.draft.src='yt'; S.draft.title='שיר לדוגמה'; S.draft.artist='דוגמה'; S.draft.raw=sampleRaw(); go('edit'); break;
    case 'fill-sample': S.draft.title=S.draft.title||'שיר לדוגמה'; S.draft.raw=sampleRaw(); render(); break;
    case 'open': S.id=el.getAttribute('data-id'); go('song'); break;
    case 'back': go('lib'); break;
    case 'edit': if(s){S.draft={id:s.id,title:s.title,artist:s.artist||'',link:s.link||'',raw:s.raw,mirror:!!s.mirror,src:s.src||'yt',fileObj:null,fileName:s.file?s.file.name:''}; go('edit');} break;
    case 'src-file': S.draft.src='file'; render(); break;
    case 'src-yt': S.draft.src='yt'; render(); break;
    case 'pick': document.getElementById('f-file').click(); break;
    case 'cancel': if(S.draft&&S.draft.id){S.id=S.draft.id;go('song');} else go('lib'); break;
    case 'save': saveDraft(); break;
    case 'del':
      if(!S.confirmDel){S.confirmDel=true; render(); break;}
      S.songs.forEach(function(x){ if(x.id===S.draft.id&&x.file) idbDel(x.file.id); });
      S.songs=S.songs.filter(function(x){return x.id!==S.draft.id;}); persist(); S.id=null; go('lib'); break;
    case 'export': exportBackup(); break;
    case 'import': document.getElementById('imp').click(); break;
    case 'opts': S.opts=!S.opts; paintOpts(); break;
    case 'tab-play': if(S.tab==='anl') break; if(S.tab==='rec') R=null; S.tab='play'; S.sel=-1; paintMain(); break;
    case 'tab-sheet': if(S.tab==='anl') break; if(S.tab==='rec') R=null; S.tab='sheet'; S.sel=-1; SH.g=-1; SH.li=-1; paintMain(); break;
    case 'capo-': if(s){s.capo=clamp(s.capo-1,0,9); touch(s); refreshSongView();} break;
    case 'capo+': if(s){s.capo=clamp(s.capo+1,0,9); touch(s); refreshSongView();} break;
    case 't-': if(s){s.t=clamp(s.t-1,-6,6); touch(s); refreshSongView();} break;
    case 't+': if(s){s.t=clamp(s.t+1,-6,6); touch(s); refreshSongView();} break;
    case 'best': if(s){var sg=suggest(P(s).F,s.t); if(sg){s.capo=sg.capo; touch(s); refreshSongView();}} break;
    case 'fs-': case 'fs+':
      if(s){ s.fs=clamp(s.fs+(a==='fs+'?2:-2),14,44); touch(s); var sh=document.getElementById('sheet'); if(sh) sh.style.setProperty('--fs',s.fs+'px'); var o=document.getElementById('fsv'); if(o) o.textContent=s.fs; } break;
    case 'off-': case 'off+':
      if(s){ s.offset=clamp(Math.round((s.offset+(a==='off+'?0.05:-0.05))*100)/100,-3,3); touch(s); var ov=document.getElementById('offv'); if(ov) ov.textContent=offLabel(s); PL.k=-2; } break;
    case 'pp': try{ if(ytp&&ytReady){ if(CLK.playing) ytp.pauseVideo(); else ytp.playVideo(); } }catch(e){} break;
    case 'seek-': seekBy(-5); break;
    case 'seek+': seekBy(5); break;
    case 'restart': try{ if(ytp&&ytReady){ ytp.seekTo(0,true); CLK.raw=-1; } }catch(e){} break;
    case 'rate':
      RATE=RATE===1?0.75:RATE===0.75?0.5:1;
      try{ if(ytp&&ytReady) ytp.setPlaybackRate(RATE); }catch(e){}
      CLK.rate=RATE; CLK.raw=-1; el.textContent=(cur()&&cur().src==='file'?'':'מהירות ')+Math.round(RATE*100)+'%'; break;
    case 'sel': if(S.tab==='play'){ var j=+el.getAttribute('data-j'); S.sel=S.sel===j?-1:j; for(var q=0;q<PL.ev.length;q++){ var bq=document.getElementById('b'+q); if(bq) bq.classList.toggle('sel',q===S.sel); } paintFix(); } break;
    case 'fix-x': S.sel=-1; buildTimeline(); break;
    case 'fix-m': case 'fix-p':
      fixApply(function(s,e){ var j=S.sel, dir=a==='fix-p'?1:-1, lo=j>0?PL.ev[j-1].t+0.05:0, hi=j+1<PL.ev.length?PL.ev[j+1].t-0.05:1e9, nt=e.t+0.1*dir;
        var B=s.rhythm&&s.rhythm.beats;
        if(B&&B.length>3){ var bi=0, bd=1e9; B.forEach(function(b,i){ var dd=Math.abs(b-e.t); if(dd<bd){bd=dd;bi=i;} }); var tgt=B[bi+dir]; if(tgt!=null) nt=tgt; }
        nt=Math.round(Math.max(lo,Math.min(hi,nt))*1000)/1000;
        if(e.o!=null&&s.sync.ev) s.sync.ev[e.o].t=nt; else s.sync.times[e.g]=nt; }); break;
    case 'fix-go': (function(){ var e=PL.ev[S.sel]; if(e&&ytp&&ytReady){ ytp.seekTo(Math.max(0,e.t+(cur().offset||0)-1.5),true); CLK.raw=-1; ytp.playVideo(); } })(); break;
    case 'fix-del':
      fixApply(function(s,e){
        if(s.auto){ var names=P(s).F.map(function(f){return f.c.src;}); names.splice(e.g,1); s.sync.times.splice(e.g,1); s.raw=autoRaw(names); s.sync.n=names.length; delete pcache[s.id]; }
        else if(e.o!=null&&s.sync.ev) s.sync.ev.splice(e.o,1);
        else s.sync.times[e.g]=null;
      });
      S.sel=-1; buildTimeline(); break;
    case 'notice-x': S.notice=''; var nt=document.querySelector('.notice'); if(nt) nt.remove(); break;
    case 'anl': runAnalysis(); break;
    case 'rh-open': RH.panel=!RH.panel; RH.tap=null; paintStrum(); break;
    case 'rh-detect': runRhythm(); break;
    case 'rh-pat': rhSet(function(r){ r.pat=el.getAttribute('data-id'); }); break;
    case 'rh-meter': rhSet(function(r,s){ var key=el.getAttribute('data-m'); if(key===meterKey(r)) return;
        if(key!=='6/8'&&r.sub===2){ r.meter=key==='3/4'?3:4; r.down=downFor(r.beats,r.meter,chordTimes(s),r.down); }
        else regrid(r,key);
        r.pat=null; }); break;
    case 'rh-double': rhSet(function(r,s){ var B=r.beats, nb=[]; for(var i=0;i<B.length;i++){ nb.push(B[i]); if(i+1<B.length) nb.push(Math.round((B[i]+B[i+1])*500)/1000); }
        r.beats=nb; r.bpm=Math.round(r.bpm*20)/10; r.down=downFor(nb,r.meter,chordTimes(s),r.down*2); r.pat=null; }); break;
    case 'rh-half': rhSet(function(r,s){ var B=r.beats, nb=[]; for(var i=0;i<B.length;i++) if(((i-r.down)%2+2)%2===0) nb.push(B[i]);
        if(nb.length<4) return; r.beats=nb; r.bpm=Math.round(r.bpm*5)/10; r.down=downFor(nb,r.meter,chordTimes(s),0); r.pat=null; }); break;
    case 'rh-tapdone': tapDone(); break;
    case 'rec-new': startRec(false); break;
    case 'rec-cont': startRec(true); break;
    case 'rec-undo': if(R&&R.idx>0){R.idx--; R.times[R.idx]=null; document.getElementById('main').innerHTML=viewRec();} break;
    case 'rec-skip': if(R&&R.idx<R.N){R.times[R.idx]=null; R.idx++; document.getElementById('main').innerHTML=viewRec();} break;
    case 'rec-save': recSave(); break;
    case 'rec-cancel': R=null; S.tab='play'; paintMain(); break;
  }
}
var saving=false;
function saveDraft(){
  if(saving) return;
  var d=S.draft, msg=document.getElementById('msg');
  function err(t){ if(msg) msg.textContent=t; }
  var s=d.id?S.songs.filter(function(x){return x.id===d.id;})[0]:null;
  var link=(d.link||'').trim();
  if(d.src==='file'){
    if(!d.fileObj&&!(s&&s.src==='file'&&s.file)) return err('בחר קובץ שיר מהטלפון.');
  } else {
    if(!d.raw.trim()) return err('הדבק קודם את האקורדים והמילים.');
    if(link&&!ytId(link)) return err('הקישור לא נראה כמו קישור ליוטיוב. השאר ריק או הדבק קישור מיוטיוב.');
  }
  saving=true;
  var btn=document.querySelector('[data-act=save]'); if(btn){btn.disabled=true;btn.textContent='שומר…';}
  var newId=d.src==='file'&&d.fileObj?uid():null;
  var put=newId?idbPut(newId,d.fileObj):Promise.resolve();
  put.then(function(){
    var isNew=!s;
    if(!s){ s=norm({id:uid(),capo:0,t:0,fs:20,offset:0}); S.songs.push(s); }
    var rawChanged=s.raw!==d.raw, srcChanged=s.src!==d.src, mirrorChanged=!!s.mirror!==!!d.mirror;
    if(rawChanged&&s.auto) s.auto=false;
    if(newId){ if(s.file&&s.file.id) idbDel(s.file.id); s.file={id:newId,name:d.fileObj.name,size:d.fileObj.size}; }
    s.title=d.title.trim()||'ללא שם'; s.artist=d.artist.trim(); s.link=link; s.raw=d.raw; s.mirror=!!d.mirror; s.src=d.src;
    var needAnl=s.src==='file'&&(isNew||!!newId||srcChanged||((rawChanged||mirrorChanged)&&!s.auto)||!synced(s));
    touch(s); saving=false; S.id=s.id; go('song');
    if(needAnl) runAnalysis();
  }).catch(function(){
    saving=false; if(btn){btn.disabled=false;btn.textContent='שמור';}
    err('לא הצלחתי לשמור את הקובץ בטלפון. ייתכן שאין מספיק מקום פנוי.');
  });
}

/* =============== audio analysis =============== */
var ANL=null;
function viewAnl(){
  if(ANL&&ANL.err) return '<div class="anl"><h2>הניתוח לא הצליח</h2><p class="note">'+esc(ANL.err)+'</p><div class="row-acts" style="justify-content:center"><button class="btn pri" data-act="anl">נסה שוב</button><button class="btn" data-act="edit">עריכת השיר</button></div></div>';
  var p=ANL?ANL.p:0;
  return '<div class="anl"><div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div><h2>מקשיב לשיר</h2><p class="note" id="anlst">'+esc(ANL?ANL.stage:'')+'</p><div class="rbar"><i id="anlbar" style="width:'+(p*100).toFixed(0)+'%"></i></div><p class="note">זה לוקח בערך חצי דקה. אפשר להשאיר את המסך פתוח.</p></div>';
}
function anlSet(stage,p){
  if(!ANL) return;
  if(stage) ANL.stage=stage; if(p!=null) ANL.p=p;
  var a=document.getElementById('anlst'), b=document.getElementById('anlbar');
  if(a&&stage) a.textContent=stage; if(b&&p!=null) b.style.width=(p*100).toFixed(0)+'%';
}
var anlRun=0;
function runAnalysis(){
  var s=cur(); if(!s||s.src!=='file'||!s.file) return;
  var run=++anlRun;
  try{ if(ytp&&ytReady) ytp.pauseVideo(); }catch(e){}
  ANL={p:0,stage:'טוען את הקובץ…',err:null}; S.tab='anl'; S.sel=-1; paintMain();
  var t0=performance.now(), X=null;
  idbGet(s.file.id).then(function(blob){
    if(!blob) throw {msg:'הקובץ לא נמצא בטלפון הזה. בחר אותו שוב בעריכת השיר.'};
    return blob.arrayBuffer?blob.arrayBuffer():new Response(blob).arrayBuffer();
  }).then(function(buf){
    anlSet('מפענח את השיר…',0.04);
    return later(30).then(function(){ return ChordEngine.decode(buf); }).catch(function(e){ if(e&&e.msg) throw e; throw {msg:'לא הצלחתי לקרוא את הקובץ. נסה קובץ MP3 אחר.'}; });
  }).then(function(x){
    if(run!==anlRun) return null;
    X=x;
    anlSet('מקשיב לאקורדים…',0.1);
    return ChordEngine.features(x,function(p){ if(run===anlRun) anlSet(null,0.1+0.65*p); });
  }).then(function(F){
    if(!F||run!==anlRun||S.id!==s.id) return;
    anlSet('מוצא את הפעמות…',0.76);
    return ChordEngine.rhythm(X,function(p){ if(run===anlRun) anlSet(null,0.76+0.14*p); },null).then(function(R){
      if(run!==anlRun||S.id!==s.id) return;
      anlSet('מסדר את האקורדים על הפעמות…',0.92);
      return later(30).then(function(){
        var pp=P(s), note='', useSheet=pp.F.length&&!s.auto, res=null;
        var seq=useSheet?pp.F.map(function(f){ return {pc:f.c.pc,base:baseOf(f.c.q)}; }):null;
        if(R) res=ChordEngine.chordsOnBeats(F,R,seq,useSheet?sheetStruct(pp):null);
        if(useSheet){
          var al=res?res.res:ChordEngine.align(F,seq);
          s.sync={vid:mediaKey(s),times:al.times,n:seq.length,auto:true};
          if(al.occ) s.sync.ev=al.occ;
          var reps=al.occ?al.occ.length-new Set(al.occ.map(function(o){return o.g;})).size:0;
          var d=al.shift>6?al.shift-12:al.shift;
          if(d!==0){
            s.t=d;
            if(d>0&&d<=7){ s.capo=d; note='ההקלטה נשמעת '+d+' חצאי טון גבוה מהאקורדים שהדבקת. שים קאפו '+d+' ונגן את האקורדים בדיוק כמו בדף.'; }
            else { var sg=suggest(pp.F,s.t); s.capo=sg?sg.capo:0; note='ההקלטה נשמעת '+Math.abs(d)+' חצאי טון נמוך מהאקורדים שהדבקת, אז התאמתי את הטון'+(s.capo?' ובחרתי קאפו '+s.capo+' כדי שיהיה קל לנגן':'')+'.'; }
          } else note='מצאתי מתי מחליפים כל אקורד, לפי הפעמות של השיר.';
          if(reps>0) note+=' זיהיתי גם חלקים שחוזרים בשיר בלי שנכתבו בדף, וסידרתי אותם.';
        } else {
          var det=res?res.res:ChordEngine.detect(F);
          if(!det.length) throw {msg:'לא זיהיתי אקורדים בשיר הזה.'};
          var names=det.map(function(x){ return chordName(x.pc,x.minor); });
          s.raw=autoRaw(names); s.auto=true; s.t=0;
          delete pcache[s.id];
          s.sync={vid:mediaKey(s),times:det.map(function(x){return x.t;}),n:names.length,auto:true};
          var sg2=suggest(P(s).F,0); s.capo=sg2?sg2.capo:0;
          note='זיהיתי '+names.length+' החלפות אקורד לפי הפעמות של השיר'+(s.capo?', ובחרתי קאפו '+s.capo+' כדי שיהיה קל לנגן':'')+'. אם אקורד לא נשמע נכון, לחץ עליו ברצועה כדי להחליף אותו.';
        }
        if(R){ var RR=res?res.R:R; RR.src='auto'; RR.pat=(s.rhythm&&s.rhythm.src==='auto')?s.rhythm.pat:null; s.rhythm=RR; }
        X=null;
        s.analyzedIn=Math.round((performance.now()-t0)/1000);
        touch(s); ANL=null; S.notice=note; S.tab='play'; paintOpts(); paintMain();
      });
    });
  }).catch(function(e){
    if(run!==anlRun) return;
    ANL={err:(e&&e.msg)||'משהו השתבש בניתוח. נסה שוב.'}; paintMain();
  });
}

/* =============== events =============== */
$app.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-act]');
  if(el&&!el.disabled) act(el.getAttribute('data-act'),el);
});
$app.addEventListener('pointerdown',function(e){
  var tb=e.target.closest&&e.target.closest('#tapbeat');
  if(tb){ e.preventDefault(); tapBeat(); return; }
  var t=e.target.closest&&e.target.closest('#tapbtn');
  if(t){ e.preventDefault(); recTap(); }
});
document.addEventListener('keydown',function(e){
  if(S.view==='song'&&S.tab==='rec'&&(e.code==='Space'||e.key==='Enter')&&!(e.target.closest&&e.target.closest('input,textarea'))){
    e.preventDefault(); recTap();
  }
});
var pvT=0;
$app.addEventListener('input',function(e){
  var t=e.target, k=t.getAttribute&&t.getAttribute('data-bind'); if(!k||!S.draft) return;
  S.draft[k]=t.type==='checkbox'?t.checked:t.value;
  if(k==='raw'||k==='mirror'){clearTimeout(pvT);pvT=setTimeout(paintPreview,180);}
});
$app.addEventListener('input',function(e){
  if(e.target.id==='seekr'&&AUD&&AUD.duration){ e.target._drag=true; var at=document.getElementById('atime'); if(at) at.textContent=fmt(AUD.duration*e.target.value/1000); }
});
$app.addEventListener('change',function(e){
  if(e.target.id==='fixsel'){ var nm=e.target.value; fixApply(function(s,ev){ var c=parseChord(nm); if(!c) return; var names=P(s).F.map(function(f){return f.c.src;}); names[ev.g]=tr(c,-shiftOf(s)); s.raw=autoRaw(names); delete pcache[s.id]; }); return; }
  if(e.target.id==='seekr'&&AUD&&AUD.duration){ e.target._drag=false; ytp.seekTo(AUD.duration*e.target.value/1000); CLK.raw=-1; return; }
  var t=e.target; if(t.getAttribute&&t.getAttribute('data-bind')==='mirror'&&S.draft){S.draft.mirror=t.checked;paintPreview();}
});
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&CLK.playing) wake(); });

window.__chords={parse:parse,tr:tr,suggest:suggest,events:events,S:S};
S.songs=load();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
render();
loop();
})();
</script>
